<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #4CAF50; color: white; padding: 10px; text-align: center; }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .footer { margin-top: 30px; font-size: 12px; color: #666; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Vítejte v naší aplikaci!</h1>
    </div>

    <p>Dobrý den, <strong th:text="${userName}">Uživateli</strong>,</p>

    <p>Děkujeme za registraci. Pro dokončení aktivace klikněte na tlačítko níže:</p>

    <p style="text-align: center;">
        <a th:href="${activationLink}" class="button">Aktivovat účet</a>
    </p>

    <p>Odkaz je platný <strong th:text="${expirationHours}">24</strong> hodin.</p>

    <div class="footer">
        <p>Tento email byl odeslán automaticky, neodpovídejte na něj.</p>
        <p>© 2024 Vaše společnost. Všechna práva vyhrazena.</p>
    </div>
</div>
</body>
</html>
